name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Secret scan (full history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Validate cloud-init.yaml (template and rendered)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cloud-init
          cloud-init schema --config-file cloud-init.yaml
          npm run -s render-cloud-init > "$RUNNER_TEMP/rendered.yaml"
          cloud-init schema --config-file "$RUNNER_TEMP/rendered.yaml"
